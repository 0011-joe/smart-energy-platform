version: '3.8'

services:
  # PostgreSQL数据库 - 存储设备信息和用户数据
  postgres:
    image: postgres:15-alpine
    container_name: smart-energy-postgres
    environment:
      POSTGRES_DB: smart_energy
      POSTGRES_USER: energy_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-energy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_admin -d smart_energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB时序数据库 - 存储能耗时序数据
  influxdb:
    image: influxdb:2.7
    container_name: smart-energy-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-influx_secure_123}
      DOCKER_INFLUXDB_INIT_ORG: smart-energy
      DOCKER_INFLUXDB_INIT_BUCKET: energy_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-my-super-secret-token}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - smart-energy-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eclipse Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-energy-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smart-energy-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI数据服务
  data_service:
    build:
      context: ./data_service
      dockerfile: Dockerfile
    container_name: smart-energy-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://energy_admin:${DB_PASSWORD:-secure_password_123}@postgres:5432/smart_energy
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUX_TOKEN:-my-super-secret-token}
      INFLUXDB_ORG: smart-energy
      INFLUXDB_BUCKET: energy_data
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - smart-energy-net
    restart: unless-stopped

  # Streamlit分析工具
  analyst_tool:
    build:
      context: ./analyst_tool
      dockerfile: Dockerfile
    container_name: smart-energy-analyst
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://data_service:8000/api
    depends_on:
      - data_service
    networks:
      - smart-energy-net
    restart: unless-stopped

  # React前端应用
  web_app:
    build:
      context: ./web_app
      dockerfile: Dockerfile
    container_name: smart-energy-web
    ports:
      - "3000:80"
    depends_on:
      - data_service
    networks:
      - smart-energy-net
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: smart-energy-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web_app
      - analyst_tool
      - data_service
    networks:
      - smart-energy-net
    restart: unless-stopped

  # 设备模拟器
  device_simulator:
    build:
      context: ./device_simulator
      dockerfile: Dockerfile
    container_name: smart-energy-simulator
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      API_URL: http://data_service:8000
      PUBLISH_INTERVAL: 10
    depends_on:
      - data_service
      - mosquitto
    networks:
      - smart-energy-net
    restart: unless-stopped

volumes:
  postgres_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:

networks:
  smart-energy-net:
    driver: bridge